# error: config.storage: base must be an absolute path without a trailing /
config:
  s3:
    endpoint: https://s3.example.net
    region: home
    bucket: os-image-staging
  storage:
    server: nfs.example.net
    base: /mnt/tank/apps/
  naming:
    image_name: "{os}-{key}"
    playbook: "packer-{os}-{key}"
    s3_prefix: "{os}"

defaults:
  disk_size: 5G
  memory: 2048
  cpus: 2
  max_age_days: 7
  retain_images: 5

images:
  - base:
      from: debian-cloud
      disk_size: 3G
