# error: image name 'base' collides with another image
config:
  s3:
    endpoint: https://s3.example.net
    region: home
    bucket: os-image-staging
  naming:
    image_name: "{key}"
    playbook: "packer-{os}-{key}"
    s3_prefix: "{os}"

defaults:
  disk_size: 5G
  memory: 2048
  cpus: 2
  max_age_days: 7
  retain_images: 5

images:
  - base:
      from: debian-cloud
  - base:
      from: fedora-cloud
