name: renovate

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        type: choice
        options: [info, debug]
        default: info

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # a PR opened with GITHUB_TOKEN would not trigger validate; one opened by the app does
      - name: bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLOUDYHOME_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLOUDYHOME_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: renovate
        env:
          RENOVATE_TOKEN: ${{ steps.bot-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
        run: npx --yes renovate@44.242.0
