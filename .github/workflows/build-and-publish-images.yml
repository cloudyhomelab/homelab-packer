name: build and publish images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  # never overlap; a queued run recomputes what is due, so replacing it loses nothing
  group: build-and-publish-images
  cancel-in-progress: false

env:
  CP_SERVER: http://controlplane.ip.cloudyhome.net:8080
  CP_AUDIENCE: controlplane_cloudyhome

jobs:
  # outside the publish environment, so the approver sees the plan in the summary before approving
  plan:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      due: ${{ steps.summary.outputs.due }}

    steps:
      - name: plan
        id: plan
        uses: cloudyhomelab/control-plane/action@f86374535ceb5613a907b7c1487eb366df711cdc # v0.2.0
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.plan
          ref: ${{ github.ref }}

      - name: summary
        id: summary
        if: ${{ !cancelled() && steps.plan.outputs.job_id != '' }}
        env:
          CONTROLPLANE_URL: ${{ env.CP_SERVER }}
          CONTROLPLANE_AUDIENCE: ${{ env.CP_AUDIENCE }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          plan="${RUNNER_TEMP}/plan.txt"
          "${RUNNER_TEMP}/cpctl" logs "${JOB_ID}" > "${plan}"
          {
            echo '### Images this run will build and publish'
            echo '```'
            cat "${plan}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # summary first, so a failed plan still shows why
          if [ "${STATUS}" != "succeeded" ]; then
            exit 1
          fi
          # the line imagectl plan prints when the set is empty
          if grep -qx 'nothing is due' "${plan}"; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: plan
    # nothing due means no approval request on the hourly runs
    if: needs.plan.outputs.due == 'true'
    runs-on: self-hosted
    timeout-minutes: 360
    environment: publish

    steps:
      - name: build and publish
        uses: cloudyhomelab/control-plane/action@f86374535ceb5613a907b7c1487eb366df711cdc # v0.2.0
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.publish
          ref: ${{ github.ref }}
