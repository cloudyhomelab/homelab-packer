name: validate

on:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CP_SERVER: http://controlplane.ip.cloudyhome.net:8080
  CP_AUDIENCE: controlplane_cloudyhome

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: validate
        uses: cloudyhomelab/control-plane/action@4076206bf56354105de616ab3914fcbd21165bcd # v0.2.1
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.validate
          ref: ${{ github.ref }}

      - name: plan
        id: plan
        if: ${{ !cancelled() }}
        uses: cloudyhomelab/control-plane/action@4076206bf56354105de616ab3914fcbd21165bcd # v0.2.1
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.plan
          ref: ${{ github.ref }}

      - name: plan summary
        if: ${{ !cancelled() && steps.plan.outputs.job_id != '' }}
        env:
          CONTROLPLANE_URL: ${{ env.CP_SERVER }}
          CONTROLPLANE_AUDIENCE: ${{ env.CP_AUDIENCE }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          {
            echo '### Images this merge would rebuild'
            echo '```'
            "${RUNNER_TEMP}/cpctl" logs "${JOB_ID}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
