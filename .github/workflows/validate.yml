name: validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # GitHub-hosted, so pull requests from forks never reach the self-hosted runner
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: latest

      - name: validate
        run: uv run imagectl validate

      - name: plan
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          status=0
          # tee, so the output is in the log as well as the summary
          uv run imagectl plan 2>&1 | tee plan.txt || status=$?
          {
            echo '### Images this merge would rebuild'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=imagectl plan::exited with $status, see the output above"
            exit "$status"
          fi
