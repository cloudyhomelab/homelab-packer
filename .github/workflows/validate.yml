name: validate

on:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CP_SERVER: http://controlplane.ip.cloudyhome.net:8080
  CP_AUDIENCE: controlplane_cloudyhome

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: validate
        uses: cloudyhomelab/control-plane/action@4076206bf56354105de616ab3914fcbd21165bcd # v0.2.1
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.validate
          ref: ${{ github.ref }}

      - name: plan
        id: plan
        if: ${{ !cancelled() }}
        uses: cloudyhomelab/control-plane/action@4076206bf56354105de616ab3914fcbd21165bcd # v0.2.1
        with:
          server: ${{ env.CP_SERVER }}
          audience: ${{ env.CP_AUDIENCE }}
          action: images.plan
          ref: ${{ github.ref }}

      - name: plan summary
        if: ${{ !cancelled() && steps.plan.outputs.job_id != '' }}
        env:
          CONTROLPLANE_URL: ${{ env.CP_SERVER }}
          CONTROLPLANE_AUDIENCE: ${{ env.CP_AUDIENCE }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          {
            echo '### Images this merge would rebuild'
            echo '```'
            "${RUNNER_TEMP}/cpctl" logs "${JOB_ID}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub-hosted: it needs a container runtime, public images only, and no internal network
  proxy-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the image ref comes from the app's .image file, so a Renovate bump is checked against the new version
      - name: check haproxy configs
        run: |
          status=0
          for cfg in ansible/apps/*/config/haproxy.cfg; do
            app=$(basename "$(dirname "$(dirname "$cfg")")")
            image=$(sed -n 's/^Image=//p' "ansible/apps/$app/quadlet/$app.image")
            echo "::group::$app ($image)"
            if ! docker run --rm --network none -v "$PWD/$cfg:/check/haproxy.cfg:ro" "$image" \
                haproxy -c -f /check/haproxy.cfg; then
              echo "::error file=$cfg::haproxy -c failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      # adapt, not validate: validate loads the tls certificate files, which exist only on the VMs
      - name: check Caddyfiles
        run: |
          status=0
          for cfg in ansible/apps/*/config/Caddyfile; do
            app=$(basename "$(dirname "$(dirname "$cfg")")")
            image=$(sed -n 's/^Image=//p' "ansible/apps/$app/quadlet/$app.image")
            echo "::group::$app ($image)"
            if ! docker run --rm --network none -v "$PWD/$cfg:/check/Caddyfile:ro" "$image" \
                caddy adapt --config /check/Caddyfile --adapter caddyfile > /dev/null; then
              echo "::error file=$cfg::caddy adapt failed"
              status=1
            fi
            formatted=$(docker run --rm --network none -v "$PWD/$cfg:/check/Caddyfile:ro" "$image" \
                caddy fmt /check/Caddyfile)
            if ! diff -u "$cfg" <(printf '%s\n' "$formatted"); then
              echo "::error file=$cfg::not formatted as caddy fmt would; apply the diff above"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # the single required check for merging; skipped or failed jobs above fail it
  all-checks-passed:
    name: all checks passed
    if: ${{ always() }}
    needs: [validate, proxy-configs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
