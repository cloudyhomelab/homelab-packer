- name: set computed facts
  hosts: all
  tasks:
    - name: set normalized architecture fact
      ansible.builtin.set_fact:
        normalized_arch: >-
          {{
          'amd64' if ansible_facts['architecture'] == 'x86_64' else
          'arm64' if ansible_facts['architecture'] == 'aarch64' else
          ansible_facts['architecture']
          }}

- name: configure observability server
  hosts: all
  become: true
  vars:
    systemd_app_apps_dir: "{{ playbook_dir }}/apps"
    systemd_app_slice: cloudyhome

  # /srv, not systemd_app_data_dirs under /var/app: a per-host share is mounted there; owners are the images' users
  pre_tasks:
    - name: create persistent data directories
      ansible.builtin.file:
        path: "/srv/{{ item.name }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0750'
      loop:
        - {name: prometheus, owner: "65534", group: "65534"}
        - {name: loki, owner: "10001", group: "10001"}
        - {name: grafana, owner: "472", group: "0"}

  roles:
    - role: app_storage

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: observability

    - role: app_idmap
      app_idmap_app: caddy-observability

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: caddy-observability

    # one hostname per Caddy ingress, through the edge, so the served certificate is what is checked
    - role: tls_probe
      tls_probe_targets:
        - { name: caddy-mgmt, address: "netbox.cloudyhome.net:443" }
        - { name: caddy-lab, address: "youtarr.cloudyhome.net:443" }
        - { name: caddy-iot, address: "homeassistant.cloudyhome.net:443" }
        - { name: caddy-observability, address: "grafana.cloudyhome.net:443" }

  post_tasks:
    # enabled, not started: the fetch needs the age key, which the vm gets at boot
    - name: enable the caddy-observability certificate fetch timer at boot
      ansible.builtin.systemd:
        name: caddy-observability-cert.timer
        enabled: true
