zone "cloudyhome.net" IN {
  type master;
  file "/var/lib/bind/cloudyhome.net.zone";
  update-policy {grant terraform-key zonesub any; };
};

zone "ip.cloudyhome.net" IN {
  type master;
  file "/var/lib/bind/ip.cloudyhome.net.zone";
  update-policy {grant terraform-key zonesub any; };
};

zone "88.10.in-addr.arpa" IN {
  type master;
  file "/var/lib/bind/88.10.in-addr.arpa.zone";
  update-policy {grant terraform-key zonesub any; };
};
