zone "cloudyhome.net" IN {
  type master;
  file "/var/lib/bind/cloudyhome.net.zone";
  update-policy {grant terraform-key zonesub any; };
};

zone "ip.cloudyhome.net" IN {
  type master;
  file "/var/lib/bind/ip.cloudyhome.net.zone";
  update-policy {grant terraform-key zonesub any; };
};

zone "88.10.in-addr.arpa" IN {
  type master;
  file "/var/lib/bind/88.10.in-addr.arpa.zone";
  update-policy {grant terraform-key zonesub any; };
};

# the resolvers transfer from 10.88.53.0/29, their own addresses rather than the VIP
zone "rpz.allow" IN {
  type master;
  file "/var/lib/bind/rpz.allow.zone";
  update-policy {grant terraform-key zonesub any; };
  notify explicit;
  allow-transfer { 10.88.16.12; 10.88.53.0/29; };
};

# replaced by bind9-rpz-fetch, so it lives in the cache rather than with the dynamic zones
zone "rpz.block" IN {
  type master;
  file "/var/cache/bind/rpz.block.zone";
  # the list is rewritten whole; diffs keep each refresh an IXFR instead of a 12 MB AXFR
  ixfr-from-differences yes;
  notify explicit;
  allow-transfer { 10.88.16.12; 10.88.53.0/29; };
};
