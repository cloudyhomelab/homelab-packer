apiVersion: 1

groups:
  - orgId: 1
    name: hosts
    folder: Homelab
    interval: 1m
    rules:
      # a series older than the 5m query lookback is gone, so this lists hosts silent for 5m;
      # a decommissioned host drops out after 24h
      - uid: host-down
        title: Host stopped reporting
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                group by (instance) (max_over_time(node_boot_time_seconds[24h]))
                unless group by (instance) (node_boot_time_seconds)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: filesystem-full
        title: Filesystem almost full
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [85]}

      - uid: unit-failed
        title: Systemd unit failed
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: node_systemd_unit_state{state="failed"} == 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: memory-low
        title: Memory low
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [10]}

  - orgId: 1
    name: certificates
    folder: Homelab
    interval: 1m
    rules:
      # renewal is due at about 30 days left and reaches the proxies within the hour, so this means
      # renewal or the fetch has been stuck for two weeks, with two weeks left to fix it
      - uid: cert-expiry
        title: Certificate expires soon
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (probe_ssl_earliest_cert_expiry - time()) / 86400
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [14]}

      # a failing probe reports no expiry, which the rule above treats as OK
      - uid: cert-probe-failed
        title: Certificate probe failing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: probe_success
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
