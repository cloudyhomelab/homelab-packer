- name: set timezone for server
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: create the systemd manager drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# the file form keeps system_timezone the only place the zone is named, and spares glibc a
# stat of /etc/localtime on every time call
- name: point TZ at /etc/localtime for every service
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/10-timezone.conf
    content: |
      [Manager]
      DefaultEnvironment="TZ=:/etc/localtime"
    owner: root
    group: root
    mode: "0644"

# this is required when connecting from a terminal (kitty, etc.) that sets a non-standard TERM value
- name: set TERM to xterm
  ansible.builtin.lineinfile:
    path: /etc/profile
    line: export TERM=xterm
    mode: "0644"
    create: true

- name: disable dynamic motd scripts
  ansible.builtin.file:
    path: /etc/update-motd.d
    recurse: true
    mode: "0440"
    state: directory

- name: empty /etc/motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: ""
    owner: root
    group: root
    mode: "0444"
