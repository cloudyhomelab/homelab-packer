- name: look up the app's ID range
  ansible.builtin.set_fact:
    app_idmap_ranges: "{{ app_idmap_ranges | default({}) | combine({app_idmap_app: app_idmap_map | app_id_range(app_idmap_app)}) }}"
  vars:
    app_idmap_map: "{{ lookup('ansible.builtin.file', app_idmap_file) | from_yaml }}"

- name: give the app its ID range
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ app_idmap_app }}:"
    line: "{{ app_idmap_app }}:{{ app_idmap_ranges[app_idmap_app].base }}:{{ app_idmap_ranges[app_idmap_app].count }}"
    create: true
    owner: root
    group: root
    mode: '0644'
  loop:
    - /etc/subuid
    - /etc/subgid
