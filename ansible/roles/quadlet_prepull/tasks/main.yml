---
- name: find the Quadlet image files
  ansible.builtin.find:
    paths: /etc/containers/systemd
    patterns: "*.image"
  register: quadlet_prepull_sources

# The Quadlet generator's output, not `systemctl list-unit-files`: it holds only Quadlet units
# and an image without any apps simply has none.
- name: find the Quadlet image units
  ansible.builtin.find:
    paths: /run/systemd/generator
    patterns: "*-image.service"
  register: quadlet_prepull_units

# Quadlet skips a file it cannot convert and the boot only logs it, so the build would ship
# without that image.
- name: check that every image file became a unit
  vars:
    expected: "{{ quadlet_prepull_sources.files | map(attribute='path') | map('basename')
                  | map('regex_replace', '\\.image$', '-image.service') | list }}"
    generated: "{{ quadlet_prepull_units.files | map(attribute='path') | map('basename') | list }}"
  ansible.builtin.assert:
    that: expected | difference(generated) | length == 0
    fail_msg: >-
      Quadlet generated no unit for {{ expected | difference(generated) | join(', ') }};
      /usr/libexec/podman/quadlet -dryrun shows why
    quiet: true

- name: read the Quadlet image files
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ quadlet_prepull_sources.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: quadlet_prepull_contents

# per host, so a VM can pull only its own apps' images, not every image any app uses
- name: allow pulls of exactly these images' repositories
  ansible.builtin.include_role:
    name: podman
    tasks_from: policy
  vars:
    podman_allowed_repositories: "{{ quadlet_prepull_contents.results | image_repositories }}"
  when: quadlet_prepull_sources.matched > 0

# Starting the unit runs the pull exactly as boot would, from the ref in the app's .image file.
# The build VM is gone after a failure, so podman's own error has to reach the build log.
- name: pull the container images into the image
  block:
    - name: start the image units
      ansible.builtin.systemd:
        name: "{{ item.path | basename }}"
        state: started
      loop: "{{ quadlet_prepull_units.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
  rescue:
    - name: read the journal of the failed pulls
      ansible.builtin.command:
        cmd: journalctl --no-pager --output=cat --lines=20 --unit={{ item.item.path | basename }}
      loop: "{{ ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      register: quadlet_prepull_journal
      changed_when: false

    - name: fail with the pull errors
      ansible.builtin.fail:
        msg: "{{ quadlet_prepull_journal.results | map(attribute='stdout_lines') | list }}"
