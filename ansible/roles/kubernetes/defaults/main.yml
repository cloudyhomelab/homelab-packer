---
# Each third-party repo may only supply these packages; apt never installs anything else from it
kubernetes_apt_allowlist:
  - origin: download.docker.com
    packages:
      - containerd.io
  - origin: pkgs.k8s.io
    packages:
      - cri-tools
      - kubeadm
      - kubectl
      - kubelet
      - kubernetes-cni
  - origin: packages.buildkite.com
    packages:
      - helm
