- name: create config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containers
    - /etc/containers/containers.conf.d
    - /etc/containers/systemd
    - /etc/containers/systemd/container.d

# applies to every .container unit on the host
- name: start containers after cloud-init has configured the host
  ansible.builtin.copy:
    src: 10-cloud-init.conf
    dest: /etc/containers/systemd/container.d/10-cloud-init.conf
    owner: root
    group: root
    mode: "0644"

- name: change default subnet configuration
  ansible.builtin.template:
    src: 10-network.conf
    dest: /etc/containers/containers.conf.d/
    owner: root
    group: root
    mode: "0644"

# one timezone for host and containers, set by the system role
- name: give containers the host's timezone
  ansible.builtin.template:
    src: 20-timezone.conf
    dest: /etc/containers/containers.conf.d/
    owner: root
    group: root
    mode: "0644"

- name: install podman and related packages
  ansible.builtin.apt:
    name: "{{ podman_packages }}"
    state: present
    autoremove: true
    install_recommends: false
