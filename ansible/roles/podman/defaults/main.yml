---
podman_default_subnet: "172.30.0.0/24"
podman_default_subnet_pools:
  - base: 172.31.0.0/16
    size: 24

podman_packages:
  - aardvark-dns
  - catatonit
  - fuse-overlayfs
  - nftables
  - passt
  - podman
  - uidmap

# Registry repositories podman may pull from, e.g. docker.io/library/caddy. Empty here, so an image
# with no apps accepts nothing; quadlet_prepull fills it from the host's .image files.
podman_allowed_repositories: []
