---
- name: add HashiCorp APT repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['lsb'].codename }}"
    components: main
    architectures: "{{ normalized_arch }}"
    signed_by: https://apt.releases.hashicorp.com/gpg
    state: present

# The HashiCorp repo may only supply these packages; apt never installs anything else from it
- name: limit the HashiCorp repository to its allowlisted packages
  ansible.builtin.copy:
    src: hashicorp-allowlist
    dest: /etc/apt/preferences.d/hashicorp-allowlist
    owner: root
    group: root
    mode: "0644"

- name: update apt repository cache
  ansible.builtin.apt:
    update_cache: true

- name: install packages
  ansible.builtin.apt:
    name:
      - packer
      - git
      - openssh-client
      - pipx
      - qemu-system-x86
      - qemu-utils
      - shellcheck
      - xorriso
    state: present
    install_recommends: false

- name: download grype package
  vars:
    homelab_packer_runner_grype_deb: "grype_{{ homelab_packer_runner_grype_version }}_linux_amd64.deb"
  ansible.builtin.get_url:
    url: "https://github.com/anchore/grype/releases/download/v{{ homelab_packer_runner_grype_version }}/{{ homelab_packer_runner_grype_deb }}"
    checksum: "sha256:{{ homelab_packer_runner_grype_sha256 }}"
    dest: /tmp/grype.deb
    mode: "0644"

- name: install grype package
  ansible.builtin.apt:
    deb: /tmp/grype.deb
    state: present

# global, so it lands in /usr/local/bin where catalog steps name it, not in root's ~/.local/bin
- name: install uv
  community.general.pipx:
    name: "uv=={{ homelab_packer_runner_uv_version }}"
    global: true
    state: present
