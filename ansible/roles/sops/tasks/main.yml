---
- name: download SOPS package
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops_{{ sops_version }}_amd64.deb"
    checksum: "sha256:{{ sops_sha256 }}"
    dest: /tmp/sops.deb
    mode: "0644"

- name: install SOPS package
  ansible.builtin.apt:
    deb: /tmp/sops.deb
    state: present
