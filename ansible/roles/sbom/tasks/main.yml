---
- name: create the SBOM work directory
  ansible.builtin.tempfile:
    state: directory
    prefix: sbom.
  register: sbom_workdir

# syft, its download and the SBOM live only on this tmpfs, so nothing of them reaches the disk
- name: generate the SBOM and fetch it
  block:
    - name: mount a tmpfs on the SBOM work directory
      ansible.posix.mount:
        path: "{{ sbom_workdir.path }}"
        src: tmpfs
        fstype: tmpfs
        opts: "size={{ sbom_tmpfs_size }},mode=0700"
        state: ephemeral

    - name: download syft
      ansible.builtin.get_url:
        url: "https://github.com/anchore/syft/releases/download/v{{ sbom_syft_version }}/syft_{{ sbom_syft_version }}_linux_amd64.tar.gz"
        checksum: "sha256:{{ sbom_syft_sha256 }}"
        dest: "{{ sbom_workdir.path }}/syft.tar.gz"
        mode: "0644"

    - name: unpack syft
      ansible.builtin.unarchive:
        src: "{{ sbom_workdir.path }}/syft.tar.gz"
        dest: "{{ sbom_workdir.path }}"
        include: [syft]
        extra_opts: [--no-same-owner]
        remote_src: true

    - name: scan the filesystem
      ansible.builtin.command:
        argv:
          - "{{ sbom_workdir.path }}/syft"
          - scan
          - dir:/
          - --quiet
          - --source-name={{ sbom_image }}
          - --source-version={{ sbom_build_version }}
          # the kernel file would be matched against upstream ranges, blind to Debian's backported
          # fixes; the dpkg cataloger already reports the kernel as its Debian package
          - --select-catalogers=-linux-kernel-cataloger
          - --exclude=./proc/**
          - --exclude=./sys/**
          - --exclude=./dev/**
          - --exclude=./run/**
          - --exclude=./tmp/**
          - --output=cyclonedx-json={{ sbom_workdir.path }}/sbom.cdx.json
      environment:
        SYFT_CHECK_FOR_APP_UPDATE: "false"
        SYFT_PARALLELISM: "{{ sbom_syft_parallelism }}"
        GOMEMLIMIT: "{{ sbom_syft_memory_limit }}"
        # syft would otherwise cache under root's home, which ships in the image
        XDG_CACHE_HOME: "{{ sbom_workdir.path }}/cache"
      changed_when: false

    - name: fetch the SBOM
      ansible.builtin.fetch:
        src: "{{ sbom_workdir.path }}/sbom.cdx.json"
        dest: "{{ sbom_dest }}"
        flat: true

  always:
    - name: unmount the SBOM tmpfs
      ansible.posix.mount:
        path: "{{ sbom_workdir.path }}"
        state: unmounted

    - name: remove the SBOM work directory
      ansible.builtin.file:
        path: "{{ sbom_workdir.path }}"
        state: absent
