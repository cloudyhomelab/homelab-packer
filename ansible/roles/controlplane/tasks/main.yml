---
- name: load the platform vars
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', controlplane_platform_vars) }}"
  vars:
    controlplane_platform_vars:
      files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_release'] }}.yml"
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - main.yml
      paths:
        - "{{ role_path }}/vars"

# creates the controlplane user and installs the unit, neither enabled nor started
- name: install the controlplane package
  binarycodes.homelab.external_package:
    name: controlplane
    version: "{{ controlplane_package_version }}"
    url: "https://github.com/cloudyhomelab/control-plane/releases/download/v{{ controlplane_version }}/{{ controlplane_package_file }}"
    checksum: "sha256:{{ controlplane_package_sha256 }}"

- name: create the kvm group
  ansible.builtin.group:
    name: kvm
    system: true

# without it imagectl falls back to accelerator=none: no error, just a build many times slower
- name: give the controlplane user access to kvm
  ansible.builtin.user:
    name: controlplane
    groups: kvm
    append: true
