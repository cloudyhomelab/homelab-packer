global_defs {
    enable_script_security
    script_user nobody nogroup
}
{% if keepalived_track_unit %}

vrrp_script tracked_unit {
    script "/usr/bin/systemctl is-active --quiet {{ keepalived_track_unit }}"
    interval 2
    fall 2
    rise 2
}
{% endif %}

# Equal priority with nopreempt: the holder keeps the address until it fails, so a returning
# peer does not cause a second failover
vrrp_instance vip {
    state BACKUP
    nopreempt
    interface {{ keepalived_interface }}
    virtual_router_id {{ keepalived_router_id }}
    priority 100
    advert_int 1
    virtual_ipaddress {
        {{ keepalived_vip }}
    }
{% if keepalived_track_unit %}
    track_script {
        tracked_unit
    }
{% endif %}
}
