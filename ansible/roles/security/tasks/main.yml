- name: secure ssh
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00_secure_ssh.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      X11Forwarding no
      LoginGraceTime 10
      MaxAuthTries 3
      MaxSessions 5
      MaxStartups 20:50:60
      PerSourceMaxStartups 20
      PubkeyAcceptedAlgorithms ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com
      HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com
      PrintMotd no
      PrintLastLog no
  notify: restart sshd

# https://dfir.ch/posts/today_i_learned_binfmt_misc/
- name: mask systemd-binfmt.service
  ansible.builtin.systemd_service:
    name: systemd-binfmt.service
    enabled: false
    masked: true

# NFS mounts are vers=4.1: no rpcbind, no pNFS block layouts (blkmapd).
# Both come with nfs-common (rpcbind is a hard Depends), so mask instead of purge
- name: mask unused nfs-common services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop:
    - rpcbind.service
    - rpcbind.socket
    - nfs-blkmap.service

- name: create resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# LLMNR listens on 5355 on every interface; names resolve through DNS
- name: disable LLMNR in resolved
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/00_no_llmnr.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Resolve]
      LLMNR=no
