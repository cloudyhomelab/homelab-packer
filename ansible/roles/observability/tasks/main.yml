- name: check that the endpoints are set
  ansible.builtin.assert:
    that:
      - observability_prometheus_url is defined
      - observability_loki_url is defined
    fail_msg: observability_prometheus_url and observability_loki_url must be set by the playbook

- name: create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# persistent, so journald recreates /var/log/journal at boot after the image cleanup empties /var/log
- name: keep the journal on disk with a size cap
  ansible.builtin.template:
    src: 10-persistent.conf
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    owner: root
    group: root
    mode: '0644'

- name: download alloy from github release
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ observability_alloy_version }}/alloy-{{ observability_alloy_version }}-1.amd64.deb"
    checksum: "sha256:{{ observability_alloy_sha256 }}"
    dest: /tmp/alloy.deb
    mode: "0644"

- name: install alloy
  ansible.builtin.apt:
    deb: /tmp/alloy.deb
    state: present

# /tmp is a tmpfs in the build VM; the package would hold its RAM until the cleanup
- name: remove the alloy package file
  ansible.builtin.file:
    path: /tmp/alloy.deb
    state: absent

- name: copy alloy config
  ansible.builtin.template:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'

- name: disable alloy usage reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting"'

- name: create alloy unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: copy alloy unit drop-in
  ansible.builtin.copy:
    src: 10-hardening.conf
    dest: /etc/systemd/system/alloy.service.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'

- name: enable alloy service
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    daemon_reload: true
