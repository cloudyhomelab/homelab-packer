- name: check that the endpoints are set
  ansible.builtin.assert:
    that:
      - observability_prometheus_url is defined
      - observability_loki_url is defined
    fail_msg: observability_prometheus_url and observability_loki_url must be set by the playbook

- name: create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# persistent, so journald recreates /var/log/journal at boot after the image cleanup empties /var/log
- name: keep the journal on disk with a size cap
  ansible.builtin.template:
    src: 10-persistent.conf
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    owner: root
    group: root
    mode: '0644'

- name: add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
    state: present

# The Grafana repo may only supply alloy; apt never installs anything else from it
- name: limit the Grafana repository to its allowlisted packages
  ansible.builtin.copy:
    src: grafana-allowlist
    dest: /etc/apt/preferences.d/grafana-allowlist
    owner: root
    group: root
    mode: "0644"

- name: install alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: copy alloy config
  ansible.builtin.template:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'

- name: disable alloy usage reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting"'

- name: create alloy unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: copy alloy unit drop-in
  ansible.builtin.copy:
    src: 10-hardening.conf
    dest: /etc/systemd/system/alloy.service.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'

- name: enable alloy service
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    daemon_reload: true
