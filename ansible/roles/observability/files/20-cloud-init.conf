# Alloy reads the hostname once at start; before cloud-init's network stage it is still the short name.
# cloud-init.target would be a cycle: on Debian cloud-final runs after multi-user.target
[Unit]
After=cloud-config.service

# the packaged unit sets HOSTNAME=%H, which Alloy prefers over the live hostname; systemd expands %H
# when it loads the unit, and cloud-init reloads units while the hostname is still the short name
[Service]
UnsetEnvironment=HOSTNAME
