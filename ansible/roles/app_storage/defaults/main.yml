---
# app_storage_app: the app whose ansible/apps/<app>/storage.yml is mounted, dataset <key> at
# <mount_root>/<app>/<key>; it gets <app>-storage.service
app_storage_file: "{{ playbook_dir }}/apps/{{ app_storage_app }}/storage.yml"
# dataset <key> of app <app> is exported as <server>:<base>/<app>/<key>
app_storage_server: moria.ip.cloudyhome.net
app_storage_base: /mnt/zpool0/cloudyhome_app_data
app_storage_mount_root: /srv

# hard: a database blocks while the server is away rather than seeing write errors
app_storage_mount_options: nfsvers=4,hard
app_storage_dir_mode: '0750'
