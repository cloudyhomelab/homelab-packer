---
# One entry per NFS mount: {unit, what, where}
app_storage_mounts: []
# One entry per app: {app, id_base, id_count, datasets: [{where, owner, dirs}]}; each gets
# <app>-storage.service and the ID range its containers name with SubUIDMap and SubGIDMap
app_storage_apps: []

# hard: a database blocks while the server is away rather than seeing write errors
app_storage_mount_options: nfsvers=4,hard
app_storage_dir_mode: '0750'
# how long the mounts wait for DNS to map the VM's name and address both ways
app_storage_dns_timeout: 15min
# seconds between those DNS checks
app_storage_dns_interval: 10
