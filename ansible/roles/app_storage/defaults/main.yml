---
# One entry per NFS mount: {unit, what, where}
app_storage_mounts: []
# One entry per app: {app, datasets: [{where, owner, dirs, mode?}]}; each gets <app>-storage.service
app_storage_apps: []

# hard: a database blocks while the server is away rather than seeing write errors
app_storage_mount_options: nfsvers=4,hard
app_storage_dir_mode: '0750'
