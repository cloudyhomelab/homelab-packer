- name: create nftables drop-in directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: copy base nftables drop-ins
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/nftables.d/
    owner: root
    group: root
    mode: '0644'
  loop: "{{ lookup('ansible.builtin.fileglob', 'nftables.d/*.nft', wantlist=True) }}"

- name: copy nftables config
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: nft -c -f %s

# enable only: starting it would apply the ruleset to the build's SSH session
- name: enable nftables service
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
