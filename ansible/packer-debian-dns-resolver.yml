- name: set computed facts
  hosts: all
  tasks:
    - name: set normalized architecture fact
      ansible.builtin.set_fact:
        normalized_arch: >-
          {{
          'amd64' if ansible_facts['architecture'] == 'x86_64' else
          'arm64' if ansible_facts['architecture'] == 'aarch64' else
          ansible_facts['architecture']
          }}

- name: configure recursive dns resolver
  hosts: all
  become: true
  vars:
    systemd_app_apps_dir: "{{ playbook_dir }}/apps"
    systemd_app_slice: cloudyhome
    dns_resolver_vip: 10.88.53.2/29
    dns_resolver_vrrp_router_id: 2

  pre_tasks:
    - name: remove DNS stub listener
      ansible.builtin.lineinfile:
        dest: /etc/systemd/resolved.conf
        regexp: '^(#\s*)?DNSStubListener.*'
        line: "DNSStubListener=no"
        state: present
        backup: true
      # handlers notified in pre_tasks run before the roles
      notify: restart resolved to release port 53

  handlers:
    - name: restart resolved to release port 53
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
        daemon_reload: true

  roles:
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: bind9-resolver
      systemd_app_data_dirs:
        - path: cache
          owner: "53"
          group: "53"

    # named listens on any address and picks the VIP up when keepalived adds it
    - role: keepalived
      keepalived_vip: "{{ dns_resolver_vip }}"
      keepalived_router_id: "{{ dns_resolver_vrrp_router_id }}"
      # net0 on Proxmox
      keepalived_interface: ens18
      keepalived_track_unit: bind9.service

    - role: nftables_dropins
