- name: pre-requisite packages for secret management
  hosts: all
  become: true
  roles:
    - role: sops

- name: basic configuration for all debian systems
  hosts: all
  become: true
  roles:
    - role: system
      system_allow_release_info_change: false
      system_timezone: "Europe/Helsinki"
      system_install_packages:
        - age
        - nfs-common
        - nftables
        - python3-debian # required by ansible.builtin.deb822_repository module
        - qemu-guest-agent
      system_remove_packages:
        - apt-listchanges
        - bash-completion
        - bind9-host
        - curl
        - groff-base
        - iptables
        - man-db
        - manpages
        - nano
        - pciutils
        - reportbug
        - screen
        - socat
        - ssh-import-id
        - tcpdump
        - traceroute
        - vim
        - vim-tiny
        - wget
        - whiptail

    - role: security
      security_ssh_service_name: "sshd"
      security_user_ca_pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOVWBELedVMij+pwZTL5DYDa8UfUx5gf+w8HLLmws0t"

    - role: ssh_keysign

    - role: nftables

    - role: zram

    - role: observability
      observability_prometheus_url: "https://prometheus.cloudyhome.net/api/v1/write"
      observability_loki_url: "https://loki.cloudyhome.net/loki/api/v1/push"

    - role: binarycodes.homelab.systemd_slices
      systemd_slices_units:
        - name: cloudyhome
          description: Cloudy Home apps
          settings:
            # percent of physical RAM; the rest stays with the OS, so sshd outlives a runaway app
            MemoryHigh: 75%
            MemoryMax: 85%
            # under contention system services get twice the CPU and I/O of the apps
            CPUWeight: 50
            IOWeight: 50
            # percent of the kernel's task limit, shared by every process and thread in the slice
            TasksMax: 50%
