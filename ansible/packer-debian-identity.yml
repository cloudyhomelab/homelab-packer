- name: configure the identity provider
  hosts: all
  become: true
  vars:
    systemd_app_apps_dir: "{{ playbook_dir }}/apps"
    systemd_app_slice: cloudyhome
  roles:
    - role: app_storage
      app_storage_apps:
        - pocket-id

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: pocket-id

    - role: nftables_dropins

    - role: cloudyhome_readiness
      cloudyhome_readiness_units:
        - pocket-id.service
