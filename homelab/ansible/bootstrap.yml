- name: set computed facts
  hosts: all
  tasks:
    - name: set normalized architecture fact
      ansible.builtin.set_fact:
        normalized_arch: >-
          {{
          'amd64' if ansible_facts['architecture'] == 'x86_64' else
          'arm64' if ansible_facts['architecture'] == 'aarch64' else
          ansible_facts['architecture']
          }}

- name: configure bootstrap server
  hosts: all
  become: true
  vars:
    systemd_app_apps_dir: "{{ playbook_dir }}/apps"
  roles:
    - role: application
      applications:
        - name: caddy-mgmt
          quadlet_units:
            - caddy-mgmt
          caddy_porkbun_api_key: "{{ sops_dns.porkbun_api_key }}"
          caddy_porkbun_secret_api_key: "{{ sops_dns.porkbun_secret_api_key }}"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: unifi-server-os
      systemd_app_data_dirs:
        - path: persistent
        - path: var-log
        - path: data
        - path: srv
        - path: var-lib-unifi
        - path: var-lib-mongodb
        - path: etc-rabbitmq-ssl
