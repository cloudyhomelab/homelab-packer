[project]
name = "imagectl"
version = "0.1.0"
description = "Build, publish and test the homelab VM images"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "ansible-core>=2.19",
  "ansible-lint>=25.9",
  "boto3>=1.40",
  "pathspec>=1.0",
  "ruamel.yaml>=0.18.15",
]

[project.scripts]
imagectl = "imagectl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
