config:
  s3:
    endpoint: https://s3-api.cloudyhome.net
    region: home
    bucket: os-image-staging
  naming:
    image_name: "{os}-{key}"
    playbook: "packer-{os}-{key}"
    s3_prefix: "{os}"

defaults:
  disk_size: 5G
  memory: 2048
  cpus: 2
  max_age_days: 7
  retain_images: 5

images:
  - base:
      from: debian-cloud
      disk_size: 3G
      children:
        - kubernetes
        - container:
            disk_size: 3G
            children:
              - edge
              - bootstrap
              - media
              - dns-primary
              - dns-secondary
              - runner
  - base:
      from: fedora-cloud
      disk_size: 5G
      children:
        - kubernetes
        - container:
            children:
              - edge
