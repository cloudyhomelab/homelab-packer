config:
  s3:
    endpoint: https://s3-api.cloudyhome.net
    region: home
    bucket: os-image-staging
  naming:
    image_name: "{os}-{key}"
    playbook: "packer-{os}-{key}"
    s3_prefix: "{os}"

defaults:
  disk_size: 5G
  memory: 2048
  cpus: 2
  max_age_days: 7
  retain_images: 5

images:
  - base:
      from: debian-cloud
      disk_size: 3G
      children:
        - kubernetes:
            children:
              - kubernetes-control
              - kubernetes-worker
        - container:
            disk_size: 3G
            children:
              - arr-stack
              - controlplane
              - dns-primary
              - dns-secondary
              - edge
              - iot-ingress-control
              - lab-ingress-control
              - management-ingress-control
              - media
              - observability
              - runner
              - unifi
