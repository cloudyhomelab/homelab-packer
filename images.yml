config:
  s3:
    endpoint: http://moria.ip.cloudyhome.net:9000
    region: home
    bucket: os-image-staging
  naming:
    image_name: "{os}-{key}"
    playbook: "packer-{os}-{key}"
    s3_prefix: "{os}"

defaults:
  disk_size: 10G
  memory: 2048
  cpus: 2
  max_age_days: 7
  retain_images: 5

images:
  - debian-cloud:
      children:
        - base:
            children:
              - kubernetes:
                  children:
                    - kubernetes-control
                    - kubernetes-worker
              - container:
                  children:
                    - arr-stack
                    - controlplane
                    - dns-primary
                    - dns-resolver
                    - dns-secondary
                    - edge
                    - homeassistant
                    - iot-ingress-control
                    - lab-ingress-control
                    - management-ingress-control
                    - media
                    - netbox
                    - observability
                    - runner
                    - unifi
